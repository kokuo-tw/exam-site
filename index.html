<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工地主任題庫練習</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7280;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212b;--tx:#e8ebf1;--mut:#9aa3b2;--line:#2c3340}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,"Noto Sans TC",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mut{color:var(--mut);font-size:14px}
select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
select{max-width:100%}
button{cursor:pointer}button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.q{font-size:18px;font-weight:600;margin:6px 0 10px;white-space:pre-wrap}
.res{font-weight:700;margin:10px 0}.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;display:none}
</style></head><body><div class="wrap">
<div class="card">
  <div class="row"><b>總進度</b><span id="tp" class="mut"></span></div>
  <div class="bar" style="margin:6px 0"><i id="tb"></i></div>
  <div class="row"><span class="mut" id="ts"></span><button onclick="showStats()">各章進度</button></div>
</div>
<div id="stats" class="card" style="display:none"></div>
<div class="card">
  <div class="row"><select id="ch" onchange="setCh(this.value)"></select>
  <select id="mode" onchange="setMode(this.value)"><option value="todo">未做的題</option><option value="wrong">錯題／不會</option><option value="all">全部</option></select></div>
  <div class="bar" style="margin-top:8px"><i id="cb"></i></div>
  <div class="mut" id="cp" style="margin-top:4px"></div>
</div>
<div id="main"></div>
<div class="card mut" style="font-size:13px">進度存在這個瀏覽器裡。換手機或清資料前先
 <button onclick="exp()">匯出進度</button> <button onclick="document.getElementById('f').click()">匯入進度</button><input id="f" type="file" accept=".json" style="display:none" onchange="imp(this)"></div>
</div><div class="toast" id="toast"></div>
<script>
const BANK={"01 營建法規": [{"n": 1, "src": "110年第1次 二類 第1題", "q": "依營造業法第六條規定，下列何者非屬營造業的分類？", "A": "綜合營造業", "B": "專業營造業", "C": "土木包工業", "D": "室內裝修業", "ans": "D"}, {"n": 2, "src": "110年第1次 二類 第2題", "q": "依據政府採購法，下列何者係屬投標廠商之特定資格？", "A": "所得稅或營業稅之納稅證明", "B": "具有符合國家品質管理之驗證文件", "C": "公會會員證", "D": "營利事業登記證", "ans": "B"}, {"n": 3, "src": "110年第1次 二類 第5題", "q": "離島地區綜合營造業或專業營造業承攬當地工程未達一定金額者，得委託建築師或技師逐案按各類科技師之執業範圍核實執行綜理施工管理，並簽章負責專任工程人員依法應辦理工作。所謂一定金額是指下列何者？", "A": "新臺幣二仟五佰萬元以上", "B": "新臺幣五仟萬元以上", "C": "新臺幣七仟五佰萬元以上", "D": "新臺幣一億元以上", "ans": "D"}, {"n": 4, "src": "110年第1次 二類 第6題", "q": "機關辦理採購，下列何者不是採購法第 101條規定得刊登政府採購公報之情形：", "A": "擅自減省工料情節重大者", "B": "偽造、變造投標、契約或履約相關文件", "C": "得標後無正當理由而不訂約者", "D": "瀕臨破產，宣告進行重整程序之廠商", "ans": "D"}, {"n": 5, "src": "110年第1次 二類 第7題", "q": "有關建築工程及民間工程剩餘土石方處理，下列說明何者錯誤？", "A": "承造人向地方政府申報建築施工計畫說明書內容應包括剩餘土石方處理計畫", "B": "承造人於出土期間之每月底前，按運送流向證明文件製作統計月報表", "C": "土石方如有運至公共工程之工地處理者，應副知工程監造單位", "D": "如發現剩餘土石方流向及數量與核准內容不一致時，地方政府應通知承造人說明釐清並將處理結果副知收容處理場所所在地之地方政府", "ans": "C"}, {"n": 6, "src": "110年第1次 二類 第8題", "q": "依建築技術規則相關規定，施工走道及階梯坡度應為三十度以下，其為十五度以上者應加釘間距小於三十公分之：", "A": "腳踏板", "B": "腳趾板", "C": "止滑板條", "D": "欄柵板", "ans": "C"}, {"n": 7, "src": "110年第1次 二類 第12題", "q": "依「政府採購法」規定，受機關委託提供採購規劃、設計、審查、監造、專案管理或代辦採購廠商之人員，意圖為私人不法之利益，對技術、工法、材料、設備或規格，為違反法令之限制或審查，因而獲得利益者之處罰為下列何者？", "A": "可處一年以上十年以下有期徒刑", "B": "可處一年以上七年以下有期徒刑", "C": "可處一年以上五年以下有期徒刑", "D": "可處一年以上三年以下有期徒刑", "ans": "B"}, {"n": 8, "src": "110年第1次 二類 第31題", "q": "【情境】小明建設公司投資一 15 層住宅，並至地方政府建管單位辦理建築物相關申報作業，請回答下列問題：\n\n自領得建造執照或雜項執照之日起，開工之規定何者錯誤？", "A": "自領得建造執照或雜項執照之日起，應於六個月內開工", "B": "起造人因故不能於前項期限內開工時，應敘明原因，申請展期一次，期限為三個月", "C": "起造人應於開工前，會同承造人及監造人將開工日期，連同姓名或名稱、住址、證書字號及承造人施工計畫書，申請該管主管建築機關備查", "D": "承造人因故未能於建築期限內完工時，得申請展期，最高得展延一年。施工逾展期期限仍未能完工時，應重新申請展期", "ans": "D"}, {"n": 9, "src": "110年第1次 二類 第32題", "q": "【情境】小明建設公司投資一 15 層住宅，並至地方政府建管單位辦理建築物相關申報作業，請回答下列問題：\n\n建築執照上的設計人及監造人，係指下列何者？", "A": "依法登記開業之土木技師", "B": "依法登記開業之結構技師", "C": "依法登記開業之建築師", "D": "依法登記開業之工地主任", "ans": "C"}, {"n": 10, "src": "110年第1次 二類 第33題", "q": "【情境】小明建設公司投資一 15 層住宅，並至地方政府建管單位辦理建築物相關申報作業，請回答下列問題：\n\n於後續辦理建築工程中必須勘驗部分時，下列說明何者正確？", "A": "指定由起造人會同設計人按時申報後，方得繼續施工", "B": "指定由設計人會同監造人按時申報後，方得繼續施工", "C": "指定由承造人會同監造人按時申報後，方得繼續施工", "D": "指定由監造人按時申報後，方得繼續施工", "ans": "C"}, {"n": 11, "src": "110年第1次 二類 第34題", "q": "【情境】小明建設公司投資一 15 層住宅，並至地方政府建管單位辦理建築物相關申報作業，請回答下列問題：\n\n工程完成後，有關申請使用執照的規定說明，下列何者正確？", "A": "由起造人會同承造人及監造人申請使用執照", "B": "主管建築機關應自接到申請之日起，五日內派員查驗完竣", "C": "主管建築機關應自接到申請之日起，七日內派員查驗完竣", "D": "公眾使用建築物之查驗期限，得展延為十日", "ans": "A"}, {"n": 12, "src": "110年第1次 二類 第35題", "q": "【情境】小明建設公司投資一 15 層住宅，並至地方政府建管單位辦理建築物相關申報作業，請回答下列問題：\n\n依據建築法五十五條於領得建造執照後，下列何者不屬應向申報該管主管建築機關備案的事項？", "A": "變更起造人", "B": "變更承造人", "C": "工程中止或廢止", "D": "變更設計人", "ans": "D"}, {"n": 13, "src": "110年第2次 二類 第1題", "q": "下列何者屬綜合營造業？", "A": "丙等營造業", "B": "專業營造業", "C": "室內裝修工程業", "D": "土木包工業", "ans": "A"}, {"n": 14, "src": "110年第2次 二類 第2題", "q": "機關辦理公告金額以上採購，除有特殊情形者外，應由其主 (會) 計及有關單位會同監辦。下列何者非屬監辦事項：", "A": "查驗", "B": "開標", "C": "比價", "D": "決標", "ans": "A"}, {"n": 15, "src": "110年第2次 二類 第4題", "q": "建築技術規則建築設計施工編第 118 條規定，特定建築物之面前道路寬度說明，下列何者正確？", "A": "電影院應臨接寬二十公尺以上之道路", "B": "加油站應臨接寬十五公尺以上之道路", "C": "集會堂應臨接寬十二公尺以上之道路", "D": "批發市場應臨接寬十公尺以上之道路", "ans": "C"}, {"n": 16, "src": "110年第2次 二類 第5題", "q": "建築法所稱建築物設計人及監造人，是為下列何者？", "A": "建築師", "B": "土木技師", "C": "室內設計師", "D": "結構技師", "ans": "A"}, {"n": 17, "src": "110年第2次 二類 第6題", "q": "小明想要自行創業當土木包工業的負責人，下列何者是依法應具備的條件？", "A": "至少有五年以上土木工程施工經驗", "B": "至少有五年以上建築工程施工經驗", "C": "資本額 80 萬元以上", "D": "資本額 100 萬元以上", "ans": "D"}, {"n": 18, "src": "110年第2次 二類 第8題", "q": "依建築技術規則建築設計施工編第 152 條規定：從事建築行為時，應於施工場所之周圍，利用鐵板木板等適當材料設置高度在幾公尺以上之圍籬？", "A": "一．五公尺以上", "B": "一．八公尺以上", "C": "二．○公尺以上", "D": "二．五公尺以上", "ans": "B"}, {"n": 19, "src": "110年第2次 二類 第9題", "q": "下列何者是受聘於營造業擔任其所承攬工程之施工技術指導及施工安全之人員？", "A": "技術士", "B": "工地主任", "C": "專任工程人員", "D": "營造業負責人", "ans": "C"}, {"n": 20, "src": "110年第2次 二類 第31題", "q": "【情境】小張考上了工地主任，開始擔任民間及公共工程工地主任之工作，並與公司專任工程人員密切配合，請回答下列問題：\n\n下列何者非營造業法之工地主任應負責辦理之工作？", "A": "依施工計畫按圖施工", "B": "工地之人、機、料管理", "C": "工 人有薪津工資而服勞務年滿 13 歲之人", "D": "被保險人因承保之意外事故，致被起訴或受有賠償請求時，訴訟費用及必要開支事先經保險公司書面允諾者", "ans": "C"}, {"n": 60, "src": "114年第2次 二類 第50題", "q": "【情境】營造工程若發生工程事故，施工廠商因資金不足以償付事故損失，對於工程契約執行及賠償責任問題，常引發工程的進度停滯，影響工程進行甚大。為分擔風險，營造業者加保雇主意外責任險。請問：\n\n加保雇主意外責任險不保事項之範圍，下列何者錯誤？", "A": "民眾騷擾", "B": "受僱人因熱危害遭受體傷", "C": "受僱人受酒類或藥劑之影響所發生本身之體傷或死亡", "D": "被保險人依勞動基準法規定之賠償責任", "ans": "B"}, {"n": 61, "src": "114年第3次 二類 第30題", "q": "屬政府採購法規範之工程之履約管理及驗收階段所生之爭議，其訴訟事件無法由下列何機關審判：", "A": "最高法院", "B": "高等法院", "C": "地方法院", "D": "行政法院", "ans": "D"}, {"n": 62, "src": "114年第3次 二類 第49題", "q": "【情境】有一政府採購法規範之工程，廠商認為已完成第二期工作範圍，機關認為尚未完成，雙方因履約爭議未能達成協議。\n\n依政府採購法第 85-1 條規定，有關爭議處理方式，下列敘述何者較不正確？", "A": "可向採購申訴審議委員會申請調解", "B": "向仲裁機構提付仲裁", "C": "調解屬廠商申請者，機關不得拒絕", "D": "因機關不同意致調解不成立者，廠商提付仲裁，機關應拒絕之", "ans": "D"}, {"n": 63, "src": "114年第3次 二類 第50題", "q": "【情境】有一政府採購法規範之工程，廠商認為已完成第二期工作範圍，機關認為尚未完成，雙方因履約爭議未能達成協議。\n\n公共工程履約爭議處理的方法，下列敘述何者較不正確？", "A": "採購申訴審議委員會辦理調解之程序及其效力，除政府採購法有特別規定者外，準用民事訴訟法有關調解之規定", "B": "調解過程中，調解委員得依職權以採購申訴審議委員會名義提出書面調解建議；機關不同意該建議者，應先報請上級機關核定", "C": "當事人不能合意但已甚接近者，採購申訴審議委員會於不違反兩造當事人之主要意思範圍內，以職權提出調解方案", "D": "採購申訴審議委員會以職權提出調解方案，當事人或參加調解之利害關係人未於 10 日內提出異議者，視為調解不成立", "ans": "D"}, {"n": 64, "src": "115年第1次 二類 第3題", "q": "機關辦理工程採購定期估驗之付款及審核程序的期限是？", "A": "三十日內完成審核程序，並於接到廠商提出之請款單據後三十日內付款", "B": "三十日內完成審核程序，並於接到廠商提出之請款單據後十日內付款", "C": "十日內完成審核程序，並於接到廠商提出之請款單據後十日內付款", "D": "十五日內完成審核程序，並於接到廠商提出之請款單據後十五日內付款", "ans": "D"}, {"n": 65, "src": "115年第1次 二類 第29題", "q": "得標人不締約時之違約罰則，稱為：", "A": "押標金", "B": "履約保證金", "C": "違約金", "D": "懲罰金", "ans": "A"}, {"n": 66, "src": "115年第1次 二類 第30題", "q": "仲裁法第 15 條規定：仲裁人有民事訴訟法第 32 條所定何人應自行迴避之同一原因者，應即告知當事人？", "A": "檢察官", "B": "律師", "C": "法官", "D": "證人", "ans": "C"}, {"n": 67, "src": "115年第1次 二類 第49題", "q": "【情境】有一棟 15 層大樓，定作人（甲方）與承攬人（乙方）簽訂承攬契約，施工期間因施工環境及施工數量差異，有些爭議。\n\n有關工程契約之變更，下列敘述何者較不正確？", "A": "若未於契約中明定，則以雙方合意以為替代", "B": "於契約所約定之範圍，廠商接獲機關通知變更契約後，除雙方另有協議外，應於 30 日內向機關提出變更", "C": "廠商得敘明理由，通知機關變更契約約定之採購標的", "D": "契約之變更，非經機關及廠商雙方合意，作成書面紀錄，並簽名或蓋章者，無效", "ans": "B"}, {"n": 68, "src": "115年第1次 二類 第50題", "q": "【情境】有一棟 15 層大樓，定作人（甲方）與承攬人（乙方）簽訂承攬契約，施工期間因施工環境及施工數量差異，有些爭議。\n\n有關工程契約之解除與終止，下列敘述何者較不正確？", "A": "有終止或解除契約爭議，先視契約內容有否就雙方終止與解除之情形處理為特別之約定", "B": "有工程瑕疵之發生時，定作人得解除契約", "C": "民法第 511 條賦予定作人隨時終止契約之規定，但應賠償承攬人因此所受之損害", "D": "民法第 507 條規定，當定作人違反工作協力義務，經承攬人定相當期限催告，仍不履行者，承攬人得解除契約", "ans": "B"}], "03 職業安全衛生": [{"n": 1, "src": "110年第1次 一類 第4題", "q": "依據營造安全衛生設施標準之規定，雇主以可調鋼管支柱為模板支撐之支柱時，應依下列何者規定辦理？", "A": "可調鋼管支撐於調整高度時，無制式之金屬附屬配件時，可以鋼筋等替代使用", "B": "上端支以樑或軌枕等貫材時，直接固定其上", "C": "高度超過三點五公尺者，每隔二公尺內設置足夠強度之縱向、橫向之水平繫條，並以牆、柱等構造物妥為連結", "D": "可調鋼管支柱可以連接使用", "ans": "C"}, {"n": 2, "src": "110年第1次 一類 第33題", "q": "【情境】某高度 60 公尺，地下室開挖深度 16 公尺之建築工程由甲營造公司承建，甲營造公司再將其中之模板工程交由乙公司施作，乙公司再將模板組立代工交由丙公司施作，甲乙丙公司分別僱有勞工於工地共同作業，甲營造公司再指定小明為工作場所負責人，其中一樓頂板模板支撐高度為 8 公尺，支撐面積為 500 平方公尺。請回答下列問題：\n\n依據營造安全衛生設施標準之規定，丙公司以鋼管施工架為模板支撐之支柱時，應依規定辦理，下列何者為非？", "A": "支撐底部得以可調型基腳座鈑調整在同一水平面", "B": "上端支以樑或軌枕等貫材時，應置鋼製頂板或托架，並將貫材固定其上", "C": "於最上層及每隔五層以內，模板支撐之架面方向之二端及每隔五架以內之交叉斜撐材面方向，應設置水平繫條或橫架", "D": "鋼管架間，應設置交叉斜撐材", "ans": "A"}, {"n": 3, "src": "110年第1次 一類 第34題", "q": "【情境】某高度 60 公尺，地下室開挖深度 16 公尺之建築工程由甲營造公司承建，甲營造公司再將其中之模板工程交由乙公司施作，乙公司再將模板組立代工交由丙公司施作，甲乙丙公司分別僱有勞工於工地共同作業，甲營造公司再指定小明為工作場所負責人，其中一樓頂板模板支撐高度為 8 公尺，支撐面積為 500 平方公尺。請回答下列問題：\n\n依據營造安全衛生設施標準之規定，甲公司在地下室開挖時，對於擋土支撐之規定，下列何者為非？", "A": "應設擋土支撐", "B": "應繪製施工圖說，並指派或委請具有地質、土木等專長專業人員簽章確認其安全性後按圖施作之", "C": "應指派擋土支撐作業主管於作業現場辦理相關事項", "D": "於每日或於四級以上地震後，或因大雨等致使地層有急劇變化之虞，或觀測系統顯示土壓變化未按預期行徑時，應實施檢查", "ans": "D"}, {"n": 4, "src": "110年第1次 一類 第49題", "q": "【情境】甲公司向乙公司承攬廠房屋頂維修工程，該屋頂材質為石棉瓦，高度距離地面五公尺，承攬金額新台幣 20 萬元整，現場指派孫大毛為工作場所負責人，甲公司負責人王大朋所僱勞工丙於從事屋頂換修作業時遭感電自屋頂墜落致死職業災害。請回答下列問題：\n\n下列何者非為本職業災害之基本原因？", "A": "未實施安全衛生教育訓練", "B": "使用攜帶式電鑽未於連接電路上設置漏電斷路器", "C": "未訂定安全衛生工作守則", "D": "未將工作環境、危害因素依規定事先告知", "ans": "B"}, {"n": 5, "src": "110年第1次 一類 第50題", "q": "【情境】甲公司向乙公司承攬廠房屋頂維修工程，該屋頂材質為石棉瓦，高度距離地面五公尺，承攬金額新台幣 20 萬元整，現場指派孫大毛為工作場所負責人，甲公司負責人王大朋所僱勞工丙於從事屋頂換修作業時遭感電自屋頂墜落致死職業災害。請回答下列問題：\n\n對於本職業災害之說明，下列何者為正確？", "A": "甲公司負責人王大朋須負職業安全衛生法之刑事罰責任", "B": "孫大毛為工作場所負責人，應負職業安全衛生法之刑事罰及刑法之業務過失責任", "C": "僅甲公司須負補償與賠償責任", " cm2", "B": "大於 420 kgf/cm2", "C": "大於 560 kgf/cm2", "D": "大於 700 kgf/cm2", "ans": "B"}, {"n": 33, "src": "111年第2次 二類 第43題", "q": "【情境】有一建築物工地使用高強度混凝土，該工地新聘的工地主任對於高強度混凝土不甚瞭解，為避免誤用而影響混凝土品質，請回答下列問題：\n\n高強度混凝土為降低漿量使用與提高施工性，對使用的砂有何要求？", "A": "砂通常採取 FM 小於 2.3", "B": "砂通常採取 FM = 2.3 ~ 2.7", "C": "砂通常採取 FM = 2.7 ~ 3.1", "D": "砂通常採取 FM 大於 3.3", "ans": "C"}, {"n": 34, "src": "111年第2次 二類 第44題", "q": "【情境】有一建築物工地使用高強度混凝土，該工地新聘的工地主任對於高強度混凝土不甚瞭解，為避免誤用而影響混凝土品質，請回答下列問題：\n\n土木 402「混凝土工程施工規範與解說」15.6.3 配比中規定，高耐蝕環境下的混凝土之水量要求為？", "A": "W/C < 0.4", "B": "W/C > 0.4", "C": "W/B < 0.4", "D": "W/B > 0.4", "ans": "C"}, {"n": 35, "src": "111年第3次 一類 第18題", "q": "輕質粒料混凝土之平均 28 天抗壓強度最低應為 175 kgf/cm2，請問輕質粒料混凝土之氣乾單位重應小於多少kg/m3？", "A": "2300 kg/m3", "B": "2250 kg/m3", "C": "2200 kg/m3", "D": "2000 kg/m3", "ans": "D"}, {"n": 36, "src": "111年第3次 二類 第14題", "q": "混凝土所用粒料之含水量依含水狀態可分為烘乾 (A)、氣乾 (B)、面乾內飽和 (C) 及潮濕 (D)，A、B、C、D 分別表示四種狀態下的重量，請問吸水率的定義為何？", "A": "((B-A)/A) x 100 (%)", "B": "((C-A)/A) x 100 (%)", "C": "((C-B)/C) x 100 (%)", "D": "((D-C)/C) x 100 (%)", "ans": "B"}, {"n": 37, "src": "111年第3次 二類 第15題", "q": "溫度對混凝土的坍度有影響，在 5 ℃~ 35 ℃ 的範圍間，溫度每升高 1 ℃時，坍度的變化為何？", "A": "增加 0.2 公分左右", "B": "增加 0.1 公分左右", "C": "減少 0.1 公分左右", "D": "減少 0.2 公分左右", "ans": "D"}, {"n": 38, "src": "111年第3次 二類 第19題", "q": "RC 柱、梁之模板組立時，常會使用截角木的主要目的為何？", "A": "模板容易組立", "B": "模板容易固定鎖緊", "C": "防止混凝土漏漿", "D": "模板容易拆卸", "ans": "C"}, {"n": 39, "src": "111年第3次 二類 第21題", "q": "有關混凝土澆置計畫內容之敘述，下列何者錯誤？", "A": "所有結構混凝土於澆置時，須製作抗壓強度試驗所需之混凝土圓柱試體", "B": "混凝土圓柱試體應在工程司監督下於卸料口取樣製作", "C": "混凝土試體於同一攪拌車應取樣 6 個為1 組", "D": "每批混凝土之抗壓強度，依所取得樣品之組數的平均抗壓強度，即為該批混凝土之抗壓強度", "ans": "C"}, {"n": 40, "src": "111年第3次 二類 第22題", "q": "使用水泥砂漿修補混凝土之蜂窩缺陷，下列敘述何者正確？", "A": "修補前，缺陷部位及其周圍向外至少 15cm 範圍內之混凝土表面須充份潤濕", "B": "修補用的水泥砂漿之材料及配比應與原混凝土的水泥砂漿相近，且砂須通過 4號篩", "C": "砂漿填入時，要充分壓實與刮平，且其完成面應與四周原混凝土面一致", "D": "修補之混凝土面應濕治養護 1 日", "ans": "A"}, {"n": 41, "src": "111年第3次 二類 第23題", "q": "模板標稱尺度依 CNS 7334 規定，有關3018 模板之敘述，下列何者正確？", "A": "模板寬度 55 mm", "B": "模板長度 1800 mm", "C": "模板高度 300 mm", "D": "模板高度 180 mm", "ans": "B"}, {"n": 42, "src": "111年第3次 二類 第42題", "q": "【情境】由於混凝土材料的生產與使用過程中會產生成許多的溫室氣體，如此大量的二氧化 碳氣體除了會對環境造成巨大的衝擊之外，且與當今環保減碳永續發展的觀念背道而馳，如何減少大量碳足跡的水泥數量及體積成為台灣共同努力的目 標。在這樣的背景之下，具有環保、減碳之綠色概念特性的綠混凝土因應而生。請回答下列問題：\n\n「綠混凝土」所使用之再生資源材料僅限膠結材料與粗粒料，其中 G 類高性能綠混凝土是指？", "A": "不含再生粗粒料之混凝土", "B": "再生粗粒料用量大於 50%", "C": "再生粗粒料用量大於 60%", "D": "再生粗粒料用量大於 80%", "ans": "A"}, {"n": 43, "src": "111年第3次 二類 第43題", "q": "【情境】由於混凝土材料的生產與使用過程中會產生成許多的溫室氣體，如此大量的二氧化 碳氣體除了會對環境造成巨大的衝擊之外，且與當今環保減碳永續發展的觀念背道而馳，如何減少大量碳足跡的水泥數量及體積成為台灣共同努力的目 標。在這樣的背景之下，具有環保、減碳之綠色概念特性的綠混凝土因應而生。請回答下列問題：\n\n依據現行綠建材解說與評估手冊在「再生綠建材評定基準表」列有之「綠混凝土」的氯離子滲透電量要求為何？", "A": "大於 10000 庫倫", "B": "5000 ~ 10000 庫倫", "C": "2000 ~ 5000 庫倫", "D": "小於 2000 庫倫", "ans": "D"}, {"n": 44, "src": "111年第3次 二類 第44題", "q": "【情境】由於混凝土材料的生產與使用過程中會產生成許多的溫室氣體，如此大量的二氧化 碳氣體除了會對環境造成巨大的衝擊之外，且與當今環保減碳永續發展的觀念背道而馳，如何減少大量碳足跡的水泥數量及體積成為台灣共同努力的目 標。在這樣的背景之下，具有環保、減碳之綠色概念特性的綠混凝土因應而生。請回答下列問題：\n\n依據現行綠建材解說與評估手冊在「再生綠建材評定基準表」列有抗壓強度較高之高性能「綠混凝土」，此種混凝土中回收之高爐爐渣粉、飛灰、和再生粒料等再生材料應佔膠結料或粒料的多少比例以上？", "A": "20%", "B": "30%", "C": "40%", "D": "50%", "ans": "D"}, {"n": 45, "src": "112年第1次 一類 第5題", "q": "模板支撐設計圖及施工說明書，下列何者為檢討事項？", "A": "設計規格及品質要求", "B": "建築圖及結構圖尺寸之差異", "C": "設計圖與施工說明書矛盾及不明確處", "D": "預留孔及水電預留孔之核對", "ans": "C"}, {"n": 46, "src": "112年第1次 一類 第18題", "q": "以下哪一種混凝土表面修飾之施工時機須掌握在混凝土開始初凝之後至終凝前完成，可保有混凝土原有之強度，又可形成較勻滑之表面？", "A": "手推整體粉光機", "B": "表面刷毛", "C": "整體粉光", "D": "造型模板成型", "ans": "C"}, {"n": 47, "src": "112年第1次 二類 第14題", "q": "下列何種非破壞檢驗方法可用來測定混凝土含水率？", "A": "微波吸收法", "B": "紅外線熱像分析法", "C": "音響放射法", "D": "透地雷達法", "ans": "A"}, {"n": 48, "src": "112年第1次 二類 第19題", "q": "有關模板回撐 (再撐) 之敘述，依內政部營建署之結構混凝土施工規範，柱、牆、及梁之不做支撐側模的模板最少拆模時間，下列何者正確？", "A": "使用回撐不需要事先規劃", "B": "回撐應於拆模後儘速進行，並應在當日完成", "C": "要先拆除所有支撐後再回撐", "D": "回撐越密越好", "ans": "B"}, {"n": 49, "src": "112年第1次 二類 第21題", "q": "有關混凝土構造物之施工縫設置的敘述，下列何者正確？", "A": "施工縫宜與主鋼筋平行", "B": "版或梁之施工縫應設置於其跨度中央三分之一範圍內", "C": "牆或柱之施工縫應設於其下之版或梁之頂面", "D": "牆或柱之施工縫應設於其基腳與樓版之底面", "ans": "B"}, {"n": 50, "src": "112年第1次 二類 第22題", "q": "有關混凝土澆置之敘述，下列何者錯誤？", "A": "應儘量保持混凝土落下之方向與澆置面垂直", "B": "混凝土於滑槽斜向落下，應先經至少 60 cm 之垂直落管", "C": "混凝土滑槽之垂直落管出口與澆置面之高差不得超過 2 m", "D": "鋼筋及鋼模之溫度高於 49°C 時，澆置混凝土前不可以用水降溫，以免混凝土品質受影響", "ans": "D"}, {"n": 51, "src": "112年第1次 二類 第39題", "q": "【情境】一鋼筋混凝土結構物有部分構件的尺寸較大，因此在水泥選擇上需注意水化熱所產生的影響，此外，在完工後也將進行一系列非破壞檢測以確保工程品質。請回答下列問題：\n\n下列何者屬於結構體混凝土非破壞性檢驗方法中的反彈度法？", "A": "彈簧式鎚法", "B": "回轉式鎚法", "C": "史密特衝擊鎚法", "D": "手鎚鋼球打擊法", "ans": "C"}, {"n": 52, "src": "112年第1次 二類 第40題", "q": "【情境】一鋼筋混凝土結構物有部分構件的尺寸較大，因此在水泥選擇上需注意水化熱所產生的影響，此外，在完工後也將進行一系列非破壞檢測以確保工程品質。請回答下列問題：\n\n水泥的組成成份 (Cement Composition) 包括矽酸三鈣 (C3S)、矽酸二鈣 (C2S)、鋁酸三鈣 (C3A) 和鋁鐵酸四鈣 (C4AF) 等熟料礦物，對於早強混凝土要增加那種成份的含量？", "A": "C3S", "B": "C2S", "C": "C3A", "D": "C4AF", "ans": "A"}, {"n": 53, "src": "112年第1次 二類 第41題", "q": "【情境】一鋼筋混凝土結構物有部分構件的尺寸較大，因此在水泥選擇上需注意水化熱所產生的影響，此外，在完工後也將進行一系列非破壞檢測以確保工程品質。請回答下列問題：\n\n下列有關混凝土抗壓強度試驗的敘述何者正確？", "A": "一般試體的尺寸其 (寬/長) 比率為 2", "B": "試體尺寸愈大強度愈大", "C": "烘乾狀況時，強度提高", "D": "加壓速率愈快，強度愈低", "ans": "C"}, {"n": 54, "src": "112年第1次 二類 第42題", "q": "【情境】A 工地預定興建一棟 15 層大樓，在 D 天時需要進行 9 樓的混凝土澆置，P 工地主任請 B 混凝土預拌廠供應預拌混凝土，利用預拌車載送到工地，並要求使用泵送車泵送混凝土至 9 樓，請回答下列問題：\n\n混凝土自拌和完成後至工地開始卸料、澆置期間，下列敘述何者錯誤？", "A": "泵送管輸送混凝土至 9 樓時，應儘量保持混凝土落下之方向與澆置面成 45 度，以預防材料分離", "B": "預拌車輸送途中，混凝土保持攪動不得超過 1 小時", "C": "要求預拌混凝土供應商提供依 CNS 3090 規定之交貨憑單，以作為混凝土品質憑證", "D": "牆、柱之混凝土應分層澆築", "ans": "A"}, {"n": 55, "src": "112年第1次 二類 第43題", "q": "【情境】A 工地預定興建一棟 15 層大樓，在 D 天時需要進行 9 樓的混凝土澆置，P 工地主任請 B 混凝土預拌廠供應預拌混凝土，利用預拌車載送到工地，並要求使用泵送車泵送混凝土至 9 樓，請回答下列問題：\n\n有關進行混凝土澆置之敘述，下列何者錯誤？", "A": "澆置面為斜面時，應由下而上澆置混凝土", "B": "分層澆築之混凝土，在上、下兩層相隔時間不可超過 1 個小時，以免形成冷縫", "C": "混凝土澆置時，不可於泵送車內加水", "D": "遇大雨時，應繼續澆置混凝土，以避免產生施工縫", "ans": "D"}, {"n": 56, "src": "112年第1次 二類 第44題", "q": "【情境】A 工地預定興建一棟 15 層大樓，在 D 天時需要進行 9 樓的混凝土澆置，P 工地主任請 B 混凝土預拌廠供應預拌混凝土，利用預拌車載送到工地，並要求使用泵送車泵送混凝土至 9 樓，請回答下列問題：\n\n混凝土澆置時以振動棒進行搗實，下列何者錯誤？", "A": "振動棒應盡量垂直緩慢插入混凝土中，不得以接觸鋼筋或模板來進行振動", "B": "振動棒插入點之間距應約為 1 m", "C": "分層澆築之混凝土，振動棒插入前次澆注混凝土層內之深度應約為 10 cm", "D": "混凝土充分搗實係指混凝土不再排出大氣泡、顏色均勻且表面上粗骨材若隱若現", "ans": "B"}, {"n": 57, "src": "112年第2次 一類 第39 5 m", "ans": "A"}, {"n": 156, "src": "115年第1次 二類 第26題", "q": "水泵應配合何者的需要，提供適當的容量、水頭、工作壓力、最高效率要求及最低馬達功率？", "A": "管路長度", "B": "管路接頭數", "C": "系統操作阻力", "D": "水泵與管路末端高差", "ans": "C"}, {"n": 157, "src": "115年第1次 二類 第27題", "q": "依建築技術規則建築設備編規定下列設備何者不必接至緊急電源？", "A": "緊急廣播設備", "B": "地下室排水、污水抽水幫浦", "C": "自來水揚水泵", "D": "出口標示燈", "ans": "C"}, {"n": 158, "src": "115年第1次 二類 第28題", "q": "出口標示燈及避難方向指示燈之緊急電源應使用蓄電池設備，其容量應能使其有效動作幾分鐘以上？", "A": "15", "B": "20", "C": "30", "D": "60", "ans": "B"}, {"n": 159, "src": "115年第1次 二類 第46題", "q": "【情境】污水處理設施（生物分解原理）流程圖：粗孔攔污柵 → 微細孔攔污柵（旁有繞流 5mm 孔攔污柵）→ 流量調整槽 → 曝氣槽 → 沉澱槽 → 消毒槽 → 放流槽；沉澱槽有迴流污泥回曝氣槽，廢棄污泥至污泥濃縮貯留槽，上澄液回曝氣槽。\n\n圖示污水處理設施之處理方式稱？", "A": "接觸曝氣法", "B": "旋轉生物盤法", "C": "分離接觸曝氣法", "D": "延長曝氣法", "ans": "D"}, {"n": 160, "src": "115年第1次 二類 第47題", "q": "【情境】污水處理設施（生物分解原理）流程圖：粗孔攔污柵 → 微細孔攔污柵（旁有繞流 5mm 孔攔污柵）→ 流量調整槽 → 曝氣槽 → 沉澱槽 → 消毒槽 → 放流槽；沉澱槽有迴流污泥回曝氣槽，廢棄污泥至污泥濃縮貯留槽，上澄液回曝氣槽。\n\n承上題，該方法適用於每日平均污水處理量多少 m3 之建築物污水處理？", "A": "小於 10 m3", "B": "大於 50 m3", "C": "大於 10 m3", "D": "小於 50 m3", "ans": "B"}, {"n": 161, "src": "115年第1次 二類 第48題", "q": "【情境】污水處理設施（生物分解原理）流程圖：粗孔攔污柵 → 微細孔攔污柵（旁有繞流 5mm 孔攔污柵）→ 流量調整槽 → 曝氣槽 → 沉澱槽 → 消毒槽 → 放流槽；沉澱槽有迴流污泥回曝氣槽，廢棄污泥至污泥濃縮貯留槽，上澄液回曝氣槽。\n\n承上題，該方法分幾種規模處理？", "A": "僅 1 種規模處理", "B": "分 2 種規模處理", "C": "分 3 種規模處理", "D": "分 4 種規模處理", "ans": "B"}]};
const CH=Object.keys(BANK);
let S;try{S=JSON.parse(localStorage.getItem('gdzr'))}catch(e){}
if(!S)S={d:{},ch:0,mode:'todo'};
let cur=null,list=[];
const save=()=>{try{localStorage.setItem('gdzr',JSON.stringify(S))}catch(e){}};
const key=(c,n)=>c+'|'+n;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)};
const correct=(q,p)=>q.ans==='送分'||q.ans.indexOf(p)>=0;
const rec=q=>S.d[key(CH[S.ch],q.n)];

function inScope(q){const r=rec(q);
  if(S.mode==='todo')return !r;
  if(S.mode==='wrong')return r&&!r.ok;
  return true}
function head(){
  const tot=CH.reduce((s,c)=>s+BANK[c].length,0),vals=Object.values(S.d),done=vals.length,ok=vals.filter(r=>r.ok).length;
  document.getElementById('tp').textContent=done+' / '+tot+'（'+Math.round(done/tot*100)+'%）';
  document.getElementById('tb').style.width=done/tot*100+'%';
  document.getElementById('ts').textContent='答對 '+ok+'　錯／不會 '+(done-ok);
  const c=CH[S.ch],qs=BANK[c],d=qs.filter(q=>rec(q)).length;
  document.getElementById('cb').style.width=d/qs.length*100+'%';
  document.getElementById('cp').textContent='本章 '+d+' / '+qs.length;
}
// 開新一題：從目前範圍挑第一題（after 之後優先）
function next(afterN){
  const qs=BANK[CH[S.ch]];
  let pool=qs.filter(inScope);
  cur=pool.find(q=>afterN===undefined||q.n>afterN)||pool[0]||null;
  draw();
}
function step(d){
  if(!cur){next();return}
  const qs=BANK[CH[S.ch]];
  const i=qs.indexOf(cur);
  if(S.mode==='all'){cur=qs[Math.min(Math.max(i+d,0),qs.length-1)];draw();return}
  const pool=qs.filter(q=>inScope(q)&&(d>0?q.n>cur.n:q.n<cur.n));
  if(pool.length){cur=d>0?pool[0]:pool[pool.length-1]}
  else{const all=qs.filter(inScope);if(!all.length)cur=null;else cur=d>0?all[0]:all[all.length-1]}
  draw();scrollTo(0,0);
}
function draw(){
  head();document.getElementById('stats').style.display='none';
  const m=document.getElementById('main');
  if(!cur){m.innerHTML='<div class="card">這個範圍沒有題目了 🎉<br>可切換「全部」或換章。</div>';return}
  const q=cur,r=rec(q);
  let h='<div class="card"><div class="mut">'+CH[S.ch]+'　第 '+q.n+' 題<br>'+q.src+'</div><div class="q">'+esc(q.q)+'</div>';
  ['A','B','C','D'].forEach(l=>{let cls='';
    if(r){if(q.ans!=='送分'&&correct(q,l))cls='ok';else if(r.pick===l)cls='bad'}
    h+='<button class="opt '+cls+'" '+(r?'disabled':'')+' onclick="pick(\''+l+'\')">'+l+'. '+esc(q[l])+'</button>'});
  if(r){h+='<div class="res '+(r.ok?'ok-t':'bad-t')+'">'+(r.pick==='?'?'不會　':r.ok?'✔ 答對　':'✘ 答錯　')+'正確答案：'+q.ans+'</div>';
    if(!r.ok)h+='<button class="p" onclick="cp()">複製題目給 Claude 做詳解</button> ';
    h+='<button onclick="redo()">重做這題</button>'}
  else h+='<button onclick="unsure()">不會（看答案）</button>';
  h+='<div class="nav"><button onclick="step(-1)">上一題</button><button class="p" onclick="step(1)">下一題</button></div></div>';
  m.innerHTML=h;
}
function pick(l){S.d[key(CH[S.ch],cur.n)]={pick:l,ok:correct(cur,l)};save();draw()}
function unsure(){S.d[key(CH[S.ch],cur.n)]={pick:'?',ok:false};save();draw()}
function redo(){delete S.d[key(CH[S.ch],cur.n)];save();draw()}
function cp(){const q=cur,r=rec(q);
  const t='【工地主任題庫】'+CH[S.ch]+' 第'+q.n+'題（'+q.src+'）\n'+q.q+'\nA. '+q.A+'\nB. '+q.B+'\nC. '+q.C+'\nD. '+q.D+'\n正確答案：'+q.ans+'\n我的作答：'+(r.pick==='?'?'不會':r.pick)+'\n請做詳解（為什麼、其他選項錯在哪、實務連結）';
  const ok=()=>toast('已複製，貼給 Claude');
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>prompt('複製這段：',t));else prompt('複製這段：',t)}
function setCh(v){S.ch=+v;save();next()}
function setMode(v){S.mode=v;save();next()}
function showStats(){const s=document.getElementById('stats');
  let h='<table><tr><th>章</th><th>完成</th><th>對</th><th>錯/不會</th></tr>';
  CH.forEach(c=>{const qs=BANK[c];let d=0,o=0;qs.forEach(q=>{const r=S.d[key(c,q.n)];if(r){d++;if(r.ok)o++}});
    h+='<tr><td>'+c+'</td><td>'+d+'/'+qs.length+'</td><td>'+o+'</td><td>'+(d-o)+'</td></tr>'});
  s.innerHTML=h+'</table>';s.style.display=s.style.display==='none'?'block':'none'}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='工地主任進度.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;f.text().then(t=>{S=JSON.parse(t);save();document.getElementById('ch').value=S.ch;document.getElementById('mode').value=S.mode;next();toast('已匯入')})}
document.getElementById('ch').innerHTML=CH.map((c,i)=>'<option value="'+i+'">'+c+'</option>').join('');
document.getElementById('ch').value=S.ch;document.getElementById('mode').value=S.mode;
next();
</script></body></html>
